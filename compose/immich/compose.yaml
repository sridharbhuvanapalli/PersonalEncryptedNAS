# Adapted from the official Immich v3.1.0 production Compose release.
name: pnas-immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?loaded from secret file by deploy wrapper}
      REDIS_HOSTNAME: immich-valkey
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      IMMICH_HELMET_FILE: "true"
    volumes:
      - ${IMMICH_LIBRARY_PATH:?set IMMICH_LIBRARY_PATH}:/data
      - /etc/localtime:/etc/localtime:ro
    networks: [backend, pnas_private]
    depends_on:
      immich-db: {condition: service_healthy}
      immich-valkey: {condition: service_healthy}
    security_opt: [no-new-privileges:true]

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    restart: unless-stopped
    volumes:
      - ${IMMICH_ML_CACHE_PATH:?set IMMICH_ML_CACHE_PATH}:/cache
    networks: [backend]
    security_opt: [no-new-privileges:true]

  immich-valkey:
    image: valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?loaded from secret file by deploy wrapper}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${IMMICH_DB_PATH:?set IMMICH_DB_PATH}:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

networks:
  backend: {internal: true}
  pnas_private: {external: true, name: pnas_private}

