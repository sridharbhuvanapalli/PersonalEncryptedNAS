name: pnas-proxy

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CADDY_VERSION: 2.11.4
    image: localhost/pnas-caddy:2.11.4-dns
    restart: unless-stopped
    ports:
      - ${PNAS_SERVICE_LAN_BIND_IP:?private service LAN IP}:443:443/tcp
      - ${PNAS_SERVICE_LAN_BIND_IP:?private service LAN IP}:443:443/udp
      - ${PNAS_TAILSCALE_BIND_IP:?Tailscale IP}:443:443/tcp
      - ${PNAS_TAILSCALE_BIND_IP:?Tailscale IP}:443:443/udp
    volumes:
      - ${CADDYFILE_PATH:?generated Caddyfile required}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:?set CADDY_DATA_PATH}:/data
      - ${CADDY_CONFIG_PATH:?set CADDY_CONFIG_PATH}:/config
      - ${DNS_PROVIDER_CREDENTIAL_FILE:?generated credential path required}:/run/secrets/dns_provider_credential:ro
    environment:
      PNAS_SERVICE_LAN_BIND_IP: ${PNAS_SERVICE_LAN_BIND_IP:?private service LAN IP}
      PNAS_TAILSCALE_BIND_IP: ${PNAS_TAILSCALE_BIND_IP:?Tailscale IP}
      PNAS_DNS_PROVIDER: ${PNAS_DNS_PROVIDER:?generated DNS provider required}
      PNAS_DNS_CREDENTIAL_FILE: /run/secrets/dns_provider_credential
    networks: [pnas_private, pnas_management]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  pnas_private: {external: true, name: pnas_private}
  pnas_management: {external: true, name: pnas_management}
