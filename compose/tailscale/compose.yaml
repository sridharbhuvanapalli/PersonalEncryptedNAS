# Lab/recovery fallback only. Production uses the supported TrueNAS Tailscale App
# with Host Network enabled and Userspace disabled.
name: pnas-tailscale-fallback

services:
  tailscale:
    image: tailscale/tailscale:v1.102.2
    restart: unless-stopped
    environment:
      TS_HOSTNAME: family-nas
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "false"
    volumes:
      - ${TAILSCALE_STATE_PATH:?set TAILSCALE_STATE_PATH}:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
