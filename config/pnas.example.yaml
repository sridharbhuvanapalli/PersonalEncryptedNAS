system:
  name: family-nas
  environment: home
  timezone: America/New_York

truenas:
  url: https://truenas.local
  verify_tls: true
  api_version: auto
  username: pnas-automation
  credential_file: /run/secrets/truenas_api_token
  adapter: mock

storage:
  chassis_bays: 12
  deployment_phase: 1
  expected_drive_count: 4
  drive_capacity_tb: 18
  drive_model: WD Ultrastar DC HC550
  required_transport: sas
  required_logical_sector_bytes: 512
  pool_name: tank
  vdev_layout: raidz2
  vdev_width: 4
  maximum_utilization_percent: 80
  warning_utilization_percent: 70
  require_cmr: true
  require_smart_extended_test: true
  require_serial_confirmation: true
  archive_pool:
    pool_name: archive
    expected_drive_count: 4
    drive_capacity_tb: 3
    drive_model: Toshiba DT01ACA300
    required_transport: sata
    required_logical_sector_bytes: 512
    vdev_layout: raidz2
    vdev_width: 4
    maximum_utilization_percent: 80
    warning_utilization_percent: 70
  solid_state:
    boot_pool_name: boot-pool
    boot_device_model: Samsung SSD PM830 128GB
    boot_capacity_gb: 128
    apps_pool_name: apps
    apps_primary_model: Inland TN320 1TB NVMe
    apps_primary_capacity_gb: 1000
    apps_initial_layout: single
    apps_target_layout: mirror
    future_mirror_minimum_capacity_gb: 1000
    recovery_pool_name: app-recovery
    recovery_device_model: Inland 512GB SATA III SSD
    recovery_capacity_gb: 512
    recovery_layout: single
  application_device_serials: [APPSSD001, APPRECOVERY001]
  boot_device_serials: [BOOTSSD001]

applications:
  nextcloud: {enabled: true}
  immich: {enabled: true}
  tailscale: {enabled: true}
  reverse_proxy: {enabled: true}

remote_access:
  tailscale:
    enabled: true
    deployment: truenas-app
    hostname: family-nas
    device_tag: tag:nas
    private_dns_suffix: nas.cloudpathz.com
    host_network: true
    userspace_networking: false
    accept_dns: false
    advertise_exit_node: false
    funnel: false
    public_ingress: false
    router_port_forwarding: false
    require_device_approval: true

backup:
  provider: backblaze-b2
  critical_data_target_tb: 2
  retention: {daily: 30, weekly: 12, monthly: 12}

hosting:
  enabled: false
  exposure: private
  base_domain: nas.cloudpathz.com
  services:
    nextcloud: cloud.nas.cloudpathz.com
    immich: photos.nas.cloudpathz.com
    manager: ops.nas.cloudpathz.com
  private_addresses:
    management_lan: 192.168.1.10
    lan: 192.168.1.20
    tailscale: null
  dns:
    provider: manual
    zone: cloudpathz.com
    credential_file: null
    manage_public_service_records: false
    rfc2136_server: null
    rfc2136_key_name: null
    rfc2136_key_algorithm: hmac-sha256
  certificates:
    issuer: letsencrypt
    email: admin@example.invalid
    environment: staging
