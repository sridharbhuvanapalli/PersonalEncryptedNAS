[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-encrypted-nas"
version = "0.1.0"
description = "Safety-first administration tooling for a private TrueNAS family NAS"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
pnas-install = "pnas.cli.install:app"
pnasctl = "pnas.cli.control:app"
pnas-manager = "pnas.manager.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pnas"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pnas"]
mypy_path = "src"
